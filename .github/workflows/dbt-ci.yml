name: dbt CI

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fintech_banking

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core==1.12.3 dbt-postgres==1.11.0

      - name: Install dbt packages
        run: dbt deps

      - name: Test database connection
        run: dbt debug --profiles-dir .github/ci

      - name: Parse dbt project
        run: dbt parse --profiles-dir .github/ci

      - name: Load CI fixture data
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -U postgres \
            -d fintech_banking \
            -f .github/ci/setup_ci.sql

      - name: Build and test dbt project
        run: dbt build --profiles-dir .github/ci