name: dbt CI

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core==1.12.3 dbt-postgres==1.11.0

      - name: Install dbt packages
        run: dbt deps

      - name: Parse dbt project
        run: dbt parse --profiles-dir .github/ci