name: dbt CI

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      DBT_SCHEMA: ci_pr

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fintech_banking

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-core==1.12.3 dbt-postgres==1.11.0

      - name: Install PR dbt packages
        run: dbt deps

      - name: Test database connection
        run: dbt debug --profiles-dir .github/ci

      - name: Load CI fixture data
        env:
          PGPASSWORD: postgres
        run: |
          psql \
            -h localhost \
            -U postgres \
            -d fintech_banking \
            -f .github/ci/setup_ci.sql

      - name: Checkout main branch
        uses: actions/checkout@v6
        with:
          ref: main
          path: main_state

      - name: Install main dbt packages
        working-directory: main_state
        run: dbt deps

      - name: Build main baseline
        working-directory: main_state
        env:
          DBT_SCHEMA: ci_main
        run: |
          dbt build \
            --profiles-dir "$GITHUB_WORKSPACE/.github/ci" \
            --target-path "$GITHUB_WORKSPACE/main_artifacts"

      - name: Show modified models
        run: |
          dbt ls \
            --select "state:modified+" \
            --state "$GITHUB_WORKSPACE/main_artifacts" \
            --profiles-dir .github/ci \
            --resource-type model

      - name: Slim CI build
        run: |
          dbt build \
            --select "state:modified+" \
            --defer \
            --state "$GITHUB_WORKSPACE/main_artifacts" \
            --profiles-dir .github/ci