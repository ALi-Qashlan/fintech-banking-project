version: 2

models:
  - name: int_customer_accounts
    description: "One row per customer summarizing account ownership, account-type breadth, balances, and first account opening date."

    columns:
      - name: customer_id
        description: "Unique identifier for the customer."
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: account_count
        description: "Total number of bank accounts owned by the customer."
        data_tests:
          - not_null
          - positive

      - name: distinct_account_type_count
        description: "Number of distinct account types owned by the customer."
        data_tests:
          - not_null
          - between_values:
              arguments:
              min_value: 1
              max_value: 3
          - less_than_or_equal_to_column:
              arguments:
                compare_column: account_count

      - name: total_balance_usd
        description: "Total balance across all accounts owned by the customer, in US dollars."
        data_tests:
          - not_null

      - name: first_account_open_date
        description: "Earliest account opening date associated with the customer."
        data_tests:
          - not_null

      - name: has_checking_account
        description: "Indicates whether the customer has at least one Checking account."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]

      - name: has_savings_account
        description: "Indicates whether the customer has at least one Savings account."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]

      - name: has_business_account
        description: "Indicates whether the customer has at least one Business account."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]

  - name: int_customer_cards
    description: "One row per customer summarizing card ownership and card-type breadth."

    columns:
      - name: customer_id
        description: "Unique identifier for the customer."
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: card_count
        description: "Total number of cards owned by the customer."
        data_tests:
          - not_null
          - positive

      - name: distinct_card_type_count
        description: "Number of distinct card types owned by the customer."
        data_tests:
          - not_null
          - between_values:
              arguments:
                min_value: 1
                max_value: 2
          - less_than_or_equal_to_column:
              arguments:
                compare_column: card_count      

      - name: has_debit_card
        description: "Indicates whether the customer has at least one Debit card."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]

      - name: has_credit_card
        description: "Indicates whether the customer has at least one Credit card."
        data_tests:
          - not_null
          - accepted_values: 
              arguments:
                values: [0, 1] 
  - name: int_customer_loans
    description: "One row per borrowing customer summarizing loan count, recorded loan exposure, loan-size metrics, interest rates, and loan history."

    columns:
      - name: customer_id
        description: "Unique identifier for the borrowing customer."
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: loan_count
        description: "Total number of loans recorded for the customer."
        data_tests:
          - not_null
          - positive

      - name: total_loan_exposure_usd
        description: "Total recorded loan principal associated with the customer, in US dollars."
        data_tests:
          - not_null
          - positive

      - name: average_loan_amount_usd
        description: "Average recorded loan amount for the customer, in US dollars."
        data_tests:
          - not_null
          - positive
          - less_than_or_equal_to_column:
              arguments:
                compare_column: max_loan_amount_usd

      - name: max_loan_amount_usd
        description: "Largest recorded individual loan amount for the customer, in US dollars."
        data_tests:
          - not_null

      - name: average_interest_rate
        description: "Average interest rate across the customer's recorded loans."
        data_tests:
          - not_null

      - name: first_loan_start_date
        description: "Earliest recorded loan start date for the customer."
        data_tests:
          - not_null

      - name: latest_loan_start_date
        description: "Most recent recorded loan start date for the customer."
        data_tests:
          - not_null 

  - name: int_customer_transactions
    description: "One row per customer with transaction activity, summarizing transaction frequency, volume, average transaction size, and activity dates."

    columns:
      - name: customer_id
        description: "Unique identifier for the customer."
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: transaction_count
        description: "Total number of transactions recorded for the customer."
        data_tests:
          - not_null
          - positive

      - name: total_transaction_volume_usd
        description: "Total transaction volume associated with the customer, in US dollars."
        data_tests:
          - not_null
          - positive

      - name: average_transaction_amount_usd
        description: "Average transaction amount for the customer, in US dollars."
        data_tests:
          - not_null
          - positive

      - name: first_transaction_at
        description: "Timestamp of the customer's earliest recorded transaction."
        data_tests:
          - not_null

      - name: last_transaction_at
        description: "Timestamp of the customer's most recent recorded transaction."
        data_tests:
          - not_null  

  - name: int_quarters
    description: "One row per calendar quarter covering the transaction history from 2019 through 2025."

    columns:
      - name: quarter_start_date
        description: "Start date of the calendar quarter."
        data_tests:
          - not_null
          - unique

  - name: int_customer_quarterly_activity
    description: "One row per customer per eligible calendar quarter, summarizing transaction activity from the quarter their banking relationship began onward."
    
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - customer_id
              - quarter_start_date

    columns:
      - name: customer_id
        description: "Unique identifier for the customer."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: quarter_start_date
        description: "Start date of the calendar quarter."
        data_tests:
          - not_null

      - name: transaction_count
        description: "Number of transactions recorded for the customer during the quarter."
        data_tests:
          - not_null
          - non_negative

      - name: total_transaction_volume_usd
        description: "Total transaction volume for the customer during the quarter, in US dollars."
        data_tests:
          - not_null
          - non_negative

      - name: average_transaction_amount_usd
        description: "Average transaction amount during the quarter. Null when no transactions occurred."

      - name: first_transaction_at
        description: "Timestamp of the customer's first transaction during the quarter. Null when no transactions occurred."

      - name: last_transaction_at
        description: "Timestamp of the customer's last transaction during the quarter. Null when no transactions occurred."                                            