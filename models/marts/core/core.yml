version: 2

models:
  - name: fct_transactions
    description: "Transaction-level fact table enriched with the customer associated with each account."

    config:
      contract:
        enforced: true

    columns:
      - name: transaction_id
        description: "Unique identifier for the transaction."
        data_type: varchar
        data_tests:
          - not_null
          - unique

      - name: account_id
        description: "Account associated with the transaction."
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_accounts')
                field: account_id

      - name: customer_id
        description: "Customer who owns the account associated with the transaction."
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: merchant_id
        description: "Merchant associated with the transaction."
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_merchants')
                field: merchant_id

      - name: amount_usd
        description: "Recorded transaction amount in US dollars."
        data_type: numeric(12, 2)
        data_tests:
          - not_null

      - name: transaction_at
        description: "Timestamp when the transaction occurred."
        data_type: timestamp
        data_tests:
          - not_null

  - name: fct_loans
    description: "Loan-level fact table enriched with customer credit profile and a project-defined loan size classification."

    config:
      contract:
        enforced: true

    columns:
      - name: loan_id
        description: "Unique identifier for the loan."
        data_type: varchar
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: "Customer associated with the loan."
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: credit_score
        description: "Customer credit score recorded in the customer source."
        data_type: integer
        data_tests:
          - not_null

      - name: loan_amount
        description: "Original recorded loan principal amount."
        data_type: numeric(12,2)
        data_tests:
          - not_null

      - name: interest_rate
        description: "Recorded interest rate for the loan."
        data_type: numeric(5, 2)
        data_tests:
          - not_null

      - name: start_date
        description: "Date on which the loan was recorded as starting."
        data_type: date
        data_tests:
          - not_null

      - name: loan_size_band
        description: "Project-defined loan size classification: small, medium, or large."
        data_type: text
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - small
                  - medium
                  - large

  - name: dim_merchants
    description: "One row per merchant containing merchant attributes and summary transaction activity."

    config:
      contract:
        enforced: true

    columns:
      - name: merchant_id
        description: "Unique identifier for the merchant."
        data_type: varchar
        data_tests:
          - not_null
          - unique

      - name: merchant_name
        description: "Merchant name."
        data_type: varchar
        data_tests:
          - not_null

      - name: city
        description: "City associated with the merchant."
        data_type: varchar
        data_tests:
          - not_null

      - name: transaction_count
        description: "Number of recorded transactions associated with the merchant."
        data_type: bigint
        data_tests:
          - not_null

      - name: total_transaction_volume_usd
        description: "Total recorded transaction volume associated with the merchant."
        data_type: numeric(20, 2)
        data_tests:
          - not_null

      - name: average_transaction_amount_usd
        description: "Average recorded transaction amount for the merchant."
        data_type: numeric(12, 2)

      - name: first_transaction_at
        description: "Timestamp of the merchant's first recorded transaction."
        data_type: timestamp

      - name: latest_transaction_at
        description: "Timestamp of the merchant's most recent recorded transaction."
        data_type: timestamp                  