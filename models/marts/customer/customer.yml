version: 2

models:
  - name: customer_relationship_summary
    description: "One row per customer summarizing customer profile, product ownership, balances, lending exposure, and historical transaction engagement."

    columns:
      - name: customer_id
        description: "Unique identifier for the customer."
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: account_count
        description: "Number of accounts owned by the customer."
        data_tests:
          - not_null

      - name: card_count
        description: "Number of cards owned by the customer."
        data_tests:
          - not_null

      - name: loan_count
        description: "Number of recorded loans associated with the customer."
        data_tests:
          - not_null

      - name: has_loan
        description: "Indicates whether the customer has at least one recorded loan."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]

      - name: transaction_count
        description: "Number of transactions recorded for the customer."
        data_tests:
          - not_null

      - name: product_category_count
        description: "Number of product categories held by the customer across accounts, cards, and loans."
        data_tests:
          - not_null

      - name: product_type_count
        description: "Number of distinct product types held across Checking, Savings, Business, Debit, Credit, and Loan."
        data_tests:
          - not_null

  - name: customer_engagement_trends
    description: "One row per account-holding customer summarizing recent quarterly transaction engagement and classifying the customer's current engagement trend."

    columns:
      - name: customer_id
        description: "Unique identifier for the customer."
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('int_customer_accounts')
                field: customer_id

      - name: quarters_observed
        description: "Number of recent eligible quarters observed for the customer, up to four."
        data_tests:
          - not_null

      - name: active_quarters_recent
        description: "Number of recent observed quarters containing transaction activity."
        data_tests:
          - not_null

      - name: zero_activity_quarters_recent
        description: "Number of recent observed quarters containing zero transactions."
        data_tests:
          - not_null

      - name: latest_transaction_count
        description: "Transaction count in the customer's latest eligible quarter."
        data_tests:
          - not_null

      - name: latest_transaction_volume_usd
        description: "Transaction volume in the customer's latest eligible quarter."
        data_tests:
          - not_null

      - name: engagement_trend
        description: "Classification of the customer's recent transaction engagement trajectory."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - insufficient_history
                  - persistently_inactive
                  - sustained_decline
                  - recent_decline
                  - sustained_improvement
                  - recent_improvement
                  - mixed_or_stable  

unit_tests:
  - name: test_customer_engagement_trend_classification
    description: >
      Verifies the customer engagement classification logic
      across all supported engagement trends.

    model: customer_engagement_trends

    given:
      - input: ref('int_customer_quarterly_activity')
        format: dict
        rows:

          # insufficient_history
          - {customer_id: C001, quarter_start_date: "2025-07-01", transaction_count: 10, total_transaction_volume_usd: 1000}

          # persistently_inactive
          - {customer_id: C002, quarter_start_date: "2025-01-01", transaction_count: 0, total_transaction_volume_usd: 0}
          - {customer_id: C002, quarter_start_date: "2025-04-01", transaction_count: 0, total_transaction_volume_usd: 0}
          - {customer_id: C002, quarter_start_date: "2025-07-01", transaction_count: 0, total_transaction_volume_usd: 0}

          # sustained_decline
          - {customer_id: C003, quarter_start_date: "2025-01-01", transaction_count: 30, total_transaction_volume_usd: 3000}
          - {customer_id: C003, quarter_start_date: "2025-04-01", transaction_count: 20, total_transaction_volume_usd: 2000}
          - {customer_id: C003, quarter_start_date: "2025-07-01", transaction_count: 10, total_transaction_volume_usd: 1000}

          # recent_decline
          - {customer_id: C004, quarter_start_date: "2025-01-01", transaction_count: 10, total_transaction_volume_usd: 1000}
          - {customer_id: C004, quarter_start_date: "2025-04-01", transaction_count: 20, total_transaction_volume_usd: 2000}
          - {customer_id: C004, quarter_start_date: "2025-07-01", transaction_count: 15, total_transaction_volume_usd: 1500}

          # sustained_improvement
          - {customer_id: C005, quarter_start_date: "2025-01-01", transaction_count: 10, total_transaction_volume_usd: 1000}
          - {customer_id: C005, quarter_start_date: "2025-04-01", transaction_count: 20, total_transaction_volume_usd: 2000}
          - {customer_id: C005, quarter_start_date: "2025-07-01", transaction_count: 30, total_transaction_volume_usd: 3000}

          # recent_improvement
          - {customer_id: C006, quarter_start_date: "2025-01-01", transaction_count: 20, total_transaction_volume_usd: 2000}
          - {customer_id: C006, quarter_start_date: "2025-04-01", transaction_count: 10, total_transaction_volume_usd: 1000}
          - {customer_id: C006, quarter_start_date: "2025-07-01", transaction_count: 15, total_transaction_volume_usd: 1500}

          # mixed_or_stable
          - {customer_id: C007, quarter_start_date: "2025-01-01", transaction_count: 10, total_transaction_volume_usd: 1000}
          - {customer_id: C007, quarter_start_date: "2025-04-01", transaction_count: 10, total_transaction_volume_usd: 1000}
          - {customer_id: C007, quarter_start_date: "2025-07-01", transaction_count: 10, total_transaction_volume_usd: 1000}

    expect:
      format: dict
      rows:
        - {customer_id: C001, engagement_trend: insufficient_history}
        - {customer_id: C002, engagement_trend: persistently_inactive}
        - {customer_id: C003, engagement_trend: sustained_decline}
        - {customer_id: C004, engagement_trend: recent_decline}
        - {customer_id: C005, engagement_trend: sustained_improvement}
        - {customer_id: C006, engagement_trend: recent_improvement}
        - {customer_id: C007, engagement_trend: mixed_or_stable}

  - name: test_customer_engagement_uses_latest_four_quarters
    model: customer_engagement_trends

    given:
      - input: ref('int_customer_quarterly_activity')
        format: dict
        rows:
          - {customer_id: C008, quarter_start_date: "2024-07-01", transaction_count: 100, total_transaction_volume_usd: 10000}
          - {customer_id: C008, quarter_start_date: "2024-10-01", transaction_count: 10, total_transaction_volume_usd: 1000}
          - {customer_id: C008, quarter_start_date: "2025-01-01", transaction_count: 20, total_transaction_volume_usd: 2000}
          - {customer_id: C008, quarter_start_date: "2025-04-01", transaction_count: 30, total_transaction_volume_usd: 3000}
          - {customer_id: C008, quarter_start_date: "2025-07-01", transaction_count: 40, total_transaction_volume_usd: 4000}

    expect:
      format: dict
      rows:
        - {customer_id: C008, quarters_observed: 4, engagement_trend: sustained_improvement}