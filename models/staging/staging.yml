version: 2

models:
  - name: stg_customers
    description: "One row per customer from the banking customer source."
    
    columns:
      - name: customer_id
        description:  "Unique identifier for each customer."
        data_tests:
          - not_null
          - unique
    
      - name: first_name
        description: "Customer's first name."
        data_tests:
          - not_null

      - name: last_name
        description: "Customer's last name."
        data_tests:
          - not_null

      - name: email
        description: "Customer's email address."
        data_tests:
          - not_null

      - name: city
        description: "City associated with the customer."
        data_tests:
          - not_null
          

      - name: credit_score
        description: "Customer's credit score."
        data_tests:
          - not_null
          - between_values:
              arguments:
                min_value: 300
                max_value: 850
        
      - name: created_at
        description: "Timestamp when the customer record was created."
        data_tests:
          - not_null

  - name: stg_accounts
    description: "One row per bank account."

    columns:
      - name: account_id
        description: "Unique identifier for the account."
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: "Identifier of the customer who owns the account."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: account_type
        description: "Type of bank account."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Checking', 'Savings', 'Business']

      - name: balance_usd
        description: "Current account balance in US dollars."
        data_tests:
          - not_null

      - name: open_date
        description: "Date when the account was opened."
        data_tests:
          - not_null

  - name: stg_cards
    description: "One row per bank card associated with a bank account."

    columns:
      - name: card_id
        description: "Unique identifier for the card."
        data_tests:
          - not_null
          - unique

      - name: account_id
        description: "Identifier of the account associated with the card."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_accounts')
                field: account_id

      - name: card_type
        description: "Type of bank card."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Debit', 'Credit']

      - name: expiration_date
        description: "Date when the card expires."
        data_tests:
          - not_null

  - name: stg_loans
    description: "One row per loan associated with a customer."

    columns:
      - name: loan_id
        description: "Unique identifier for the loan."
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: "Identifier of the customer who took the loan."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: loan_amount
        description: "Principal amount of the loan in US dollars."
        data_tests:
          - not_null
          - positive

      - name: interest_rate
        description: "Annual interest rate applied to the loan."
        data_tests:
          - not_null

      - name: start_date
        description: "Date when the loan started."
        data_tests:
          - not_null

  - name: stg_merchants
    description: "One row per merchant."

    columns:
      - name: merchant_id
        description: "Unique identifier for the merchant."
        data_tests:
          - not_null
          - unique

      - name: merchant_name
        description: "Name of the merchant."
        data_tests:
          - not_null

      - name: city
        description: "City where the merchant is located."
        data_tests:
          - not_null
                  
  - name: stg_branches
    description: "One row per bank branch."

    columns:   
      - name: branch_id
        description: "Unique identifier for the branch."
        data_tests:  
          - not_null
          - unique

      - name: branch_name
        description: "Name of the bank branch."
        data_tests:
          - not_null

      - name: manager_name
        description: "Name of the branch manager."
        
      - name: city
        description: "City where the branch is located."
        data_tests:
          - not_null

      - name: country
        description: "Country where the branch is located."
        data_tests:
          - not_null   

  - name: stg_transactions
    description: "One row per financial transaction."

    columns:
      - name: transaction_id
        description: "Unique identifier for the transaction."
        data_tests:
          - not_null
          - unique

      - name: account_id
        description: "Identifier of the account from which the transaction was made."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_accounts')
                field: account_id

      - name: merchant_id
        description: "Identifier of the merchant involved in the transaction."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_merchants')
                field: merchant_id

      - name: amount_usd
        description: "Transaction amount in US dollars."
        data_tests:
          - not_null
          
      - name: transaction_at
        description: "Timestamp when the transaction occurred."
        data_tests:
          - not_null    